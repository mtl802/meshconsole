# meshconsole 控制台配置样例。
# 拷贝为 console.yaml 后修改；生产环境文件权限建议 600。
# M1b-a 起 console 全程 HTTPS（DESIGN §7-3）：先 `make pki` 生成证书再启动，
# 无明文 http 入口；监听地址仍务必只暴露在 Tailnet IP 或 localhost（DESIGN §2/§7）。

listen: "127.0.0.1:7700"

# SQLite 数据库文件路径（目录不存在会自动创建；支持 ~ 展开）。
db_path: "./data/meshconsole.db"

# 一次性注册 token 列表：每个 token 仅可成功注册一个节点，用后即废
# （DESIGN §4.1-A：短期、一次性、绑定预期节点）。
# 每个条目必须为映射写法，token / expires_at / expected_node 三个字段全部必填，
# 纯字符串写法已在配置加载时直接报错（无到期、不绑节点的 token 等于永久凭据）：
#   token          注册 token 明文，部署时生成（如 `openssl rand -hex 16`），
#                  经带外交给目标节点的 `meshagent register -token` 使用；
#                  不入库、不出现在接口响应中。
#   expires_at     到期时刻（RFC3339）：过期后该 token 注册一律 401，
#                  启动时已过期的 token 直接拒绝加载。
#   expected_node  绑定预期节点名：仅该节点名可用此 token 注册，其他名一律 401。
registration_tokens:
  - token: "change-me-openssl-rand-hex-16-0001"
    expires_at: "2026-12-31T23:59:59Z"
    expected_node: "mac-mini"
  - token: "change-me-openssl-rand-hex-16-0002"
    expires_at: "2027-03-31T23:59:59Z"
    expected_node: "node-02"

# ---- TLS（DESIGN §7-3：CA 持久化生命周期，启动仅加载、不重新生成）----

# CA 与服务端证书目录。生产建议 /opt/meshconsole/pki（600 私钥权限由工具保证）。
# 先运行 `make pki`（或 `./bin/meshconsole pki -config console.yaml`）生成，
# 幂等：已存在的 CA/私钥不会被覆盖；输出末尾的 fingerprint 供 agent 配置固定。
# **勿并行运行 make pki**（R11-E）：无跨进程锁，并发执行可能产生 CA/私钥
# 配对不一致的产物（工具会校验配对并拒绝，但仍应避免）。
pki_dir: "./pki"

# 服务端证书/私钥路径。留空取 <pki_dir>/server.crt 与 <pki_dir>/server.key。
# tls_cert: ""
# tls_key: ""

# 本机 Tailnet IP（可选）：仅 `meshconsole pki` 生成证书时写入 SAN，
# 使 agent 可经 https://<tailnet-ip>:7700 连接并验证通过。
# tailnet_ip: "100.64.0.1"

# 追加 SAN（M1b-c2 §6）：条目为 IP 字面量或 DNS 主机名——URL/端口/CIDR/空值
# 一律在 pki 生成时报错，规范化去重。任何 PKI 写入前统一校验；变更后
# `make pki` 会自动重签证书（CA/私钥不动，agent 链验证不受影响）。
# 公网部署示例值：
# tls_extra_sans: ["1.13.158.180"]

# ---- 生产部署安全注意（M1b-b 落地，DESIGN §7-5）----
# agent 侧 docker 型服务查询走 docker CLI：普通 docker CLI 等价于宿主 root，
# 生产部署中节点上的 docker 访问必须以只读 helper 或 socket-proxy 提供受限
# 入口（agent 配置 docker_bin 指向该包装），不允许 agent 直接持有 docker.sock
# 访问权。console 本身不接触 docker，此处留注以约束整体部署边界。

# ---- Headscale 集成（M1b-b，只读拉取；SPEC-M1b-b §3）----
# 配置了本段即启用：console 定期拉取 headscale REST /api/v1/node，
# tailnet 节点状态并入 mesh 视图（Web 面板 Tailnet 区 + MCP get_mesh_status）。
# 拉取失败保留上次数据并节流告警（WARN ≤1/h），恢复后自动续替。
# 不需要集成时：删除本段即可，启动日志 INFO 一条「disabled」，不报错。
# headscale:
#   url: "http://127.0.0.1:8080"     # headscale API 基地址（scheme 限 http/https，不带末尾斜杠）
#   api_key: "headscale-preauth-api-key"  # `headscale apikeys create` 预生成；不入 git
#   interval_s: 300                  # 拉取周期，缺省 300s，下限 30s（保持低频只读）

# ---- Web 面板与账号（M1b-b + M1b-c2 §1）----
# 与 agent API 同端口：GET / 面板页、GET /api/panel/overview 聚合 JSON（15s 轮询）。
# 认证在所有网络形态始终开启（含回环）：未登录一律 302 /login，匿名可及仅
# 登录页/静态资源/healthz。账号走 CLI 管理（交互口令，bcrypt cost 10）：
#   meshconsole user add lunge            # 创建用户（口令两遍确认）
#   meshconsole user passwd/disable/enable lunge
#   meshconsole token create lunge        # MCP API token（明文仅显示一次）
# 会话 Cookie mc_session（HttpOnly/Secure/SameSite=Lax），滑动续期、30 天绝对期限；
# 登录防护：per-IP 5 次失败/分 429、全局 bcrypt 并发 ≤2、未知用户 dummy bcrypt；
# 改密/禁用即撤销该用户全部会话与 token。
#
# 面板 Host/Origin 白名单（缺省 = 回环名单 localhost/127.0.0.1/::1；显式空数组
# 同义；条目为裸主机名/IP，不带 scheme/端口）。畸形 Host（非数字/空端口、
# [localhost] 等方括号非 IPv6、userinfo、携带 path）一律 403。
# 公网部署示例值：
# panel_allowed_hosts: ["localhost", "127.0.0.1", "::1", "100.64.0.3", "1.13.158.180"]

# ---- agent API 来源收敛（M1b-c2 §5）----
# /api/agent/* 的 RemoteAddr 网段过滤（网络过滤非身份认证，节点 token 校验
# 独立保留；不读任何转发头）。缺省 = 回环 + 私网 + Tailnet CGNAT 段
# （127/8、::1、10/8、172.16/12、192.168/16、100.64/10）；显式空数组 = 仅回环。
# 公网暴露后保持缺省即可（公网来源 403）：
# agent_allowed_cidrs: []

# ---- 公网模式启动门槛（M1b-c2 §4）----
# 实际绑定地址非回环（如 0.0.0.0:7700）即公网模式，启动逐项检查、任一失败
# 拒绝启动：①存在 ≥1 个启用用户；②本 config 文件普通文件且 0600 且属运行
# 用户（Windows 为 ACL 等价约束）；③panel_allowed_hosts 合法（加载期校验）。
# 数据文件权限强制 data 目录 0700、DB/WAL/SHM 0600。

# ---- 资源限额 ----

# 连接总数上限（DESIGN §7-4/§7-9，LimitListener）：超出的并发连接在内核
# accept 队列排队而非被拒。默认 256，M1 规模（3 节点 + 1 客户端）无需调整。
max_connections: 256

# 无心跳判定离线的秒数（DESIGN §4.1：默认 60）。
offline_after_s: 60

# metrics 保留天数（DESIGN §5：保留 7 天，后台每小时清理）。
metrics_retention_days: 7

# 日志级别：debug | info | warn | error（JSON 结构化输出）。
log_level: "info"
