<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>MeshConsole — Agent 控制中台</title>
<link rel="stylesheet" href="/glass.css?v=13">
</head>
<body data-app data-theme="light">
<!-- TODO(theme-switch): M1b-c 默认亮色；暗色变量块完整保留在 glass.css
     [data-theme="dark"]（token 三元组 + 语义层 + 材质覆盖），M1c+ 做切换时
     翻本属性即可，组件代码零改动 -->

<!-- atmosphere：玻璃之下必须有可折射的颜色（亮色 mesh，multiply 叠 pastel） -->
<div class="atmosphere" aria-hidden="true">
  <div class="blob blob--a"></div>
  <div class="blob blob--b"></div>
  <div class="blob blob--c"></div>
  <div class="arc"></div>
  <div class="grid-lines"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<main class="shell">
  <header class="masthead">
    <div class="reveal--clip" style="--d:.06s">
      <p class="kicker">meshconsole // agent 控制中台</p>
      <h1 class="display">Agent <em>运维</em></h1>
    </div>
    <div class="readout glass-surface-soft reveal" style="--d:.22s" id="readout" aria-label="mesh 总览">
      <div class="gauge">
        <span class="gauge-num" id="g-online">–</span>
        <span class="label">在线终端</span>
      </div>
      <div class="gauge">
        <span class="gauge-num" id="g-tasks">–</span>
        <span class="label">运行任务</span>
      </div>
      <div class="gauge">
        <span class="gauge-num" id="g-issues">–</span>
        <span class="label">服务异常</span>
      </div>
      <div class="gauge">
        <span class="gauge-num" id="g-tailnet">–</span>
        <span class="label">tailnet 在线</span>
      </div>
    </div>
    <form class="logout-form reveal" style="--d:.3s" method="post" action="/logout">
      <button class="logout-btn" type="submit" title="注销当前会话">登出</button>
    </form>
  </header>

  <section class="grid" aria-label="agent 控制中台">
    <!-- 核心区：agent 会话活跃（SPEC-M1d §3.5——终端/agent/会话文件/最近活动/持续时长；
         内容解析降级 R41-B2：主题空时卡片显示文件名+mtime） -->
    <div class="col-12 stack reveal" style="--d:.4s">
      <section class="glass-surface panel">
        <header class="panel-head">
          <h2 class="panel-title">agent 会话活跃</h2>
          <span class="panel-meta" id="sessions-meta">全部安静</span>
        </header>
        <div class="task-grid" id="sessions-grid">
          <div class="task-quiet" data-empty>
            <span class="dot dot--dim"></span>
            <span class="quiet-word">全部安静</span>
            <span class="quiet-sub">mesh 内暂无活跃 agent 会话</span>
          </div>
        </div>
      </section>
    </div>

    <!-- 任务下发（SPEC-M1d §4）：白名单命令表单 + 对账清单；服务端为唯一授权面 -->
    <div class="col-12 stack reveal" style="--d:.45s">
      <section class="glass-surface panel">
        <header class="panel-head">
          <h2 class="panel-title">任务下发</h2>
          <span class="panel-meta" id="commands-meta">0 条</span>
        </header>
        <form class="cmd-form glass-inset" id="cmd-form">
          <label class="cmd-field">终端
            <select id="cmd-node"></select>
          </label>
          <label class="cmd-field">命令类型
            <select id="cmd-kind"></select>
          </label>
          <label class="cmd-field" id="cmd-unit-row" style="display:none">服务单元
            <input id="cmd-unit" type="text" placeholder="unit 名">
          </label>
          <label class="cmd-field" id="cmd-n-row" style="display:none">行数
            <input id="cmd-n" type="number">
          </label>
          <label class="cmd-field">超时（秒）
            <input id="cmd-timeout" type="number" min="1" max="300" placeholder="30">
          </label>
          <button class="cmd-submit" id="cmd-submit" type="submit">下发命令</button>
          <span class="cmd-msg" id="cmd-msg"></span>
        </form>
        <div class="panel-body" id="cmd-list">
          <p class="empty" data-empty>还没有命令记录</p>
        </div>
      </section>
    </div>

    <!-- 终端区：每终端一张卡（状态/角色/sparkline/agent 清单 + last_activity） -->
    <div class="col-12 stack reveal" style="--d:.5s">
      <section class="glass-surface panel">
        <header class="panel-head">
          <h2 class="panel-title">终端</h2>
          <span class="panel-meta" id="nodes-meta">0</span>
        </header>
        <div class="node-grid" id="nodes-grid">
          <p class="empty" data-empty>还没有节点上报</p>
        </div>
        <footer class="panel-foot">
          发现的 agent 仅登记与监测，不可被远程调用 · 「活跃」来自会话目录的最近修改时间
        </footer>
      </section>
    </div>

    <div class="col-5 stack reveal" style="--d:.6s">
      <section class="glass-surface panel">
        <header class="panel-head">
          <h2 class="panel-title">受管服务</h2>
          <span class="panel-meta" id="services-meta">0</span>
        </header>
        <div class="panel-body" id="services-list">
          <p class="empty" data-empty>没有服务上报</p>
        </div>
      </section>
    </div>

    <div class="col-7 stack reveal" style="--d:.7s">
      <section class="glass-surface panel">
        <header class="panel-head">
          <h2 class="panel-title">Tailnet</h2>
          <span class="panel-meta" id="tailnet-meta">headscale</span>
        </header>
        <div class="panel-body" id="tailnet-list">
          <p class="empty" data-empty>headscale 集成未启用或尚未同步</p>
        </div>
      </section>
    </div>
  </section>

  <footer class="pagefoot reveal" style="--d:.85s">
    <span class="dot dot--dim" id="fresh-dot"></span>
    <span id="fresh-text">等待数据…</span>
    <span>·</span>
    <span>15s 轮询</span>
    <span class="push"></span>
    <span class="readonly-pill">只读</span>
  </footer>
</main>

<script src="/app.js?v=14"></script>
</body>
</html>
